<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Портретов</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel для JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { margin: 0; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Хэш-функция
        const hashCode = (str) => {
            let hash = 0;
            if (str.length === 0) return hash;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        };

        // Палитры
        const bgColors = ['#FFE5EC', '#E5F0FF', '#E5FFE9', '#FFF3E5', '#F0E5FF', '#FFFFE5', '#E5FFFF', '#FFDFD3'];
        const skinColors = ['#FFF0E6', '#FFE0CC', '#FFD1B3', '#E6B89C', '#CC997A', '#A67C65', '#805C47'];
        const hairColors = ['#2C2C2C', '#4A3B32', '#7C543A', '#A36845', '#D49466', '#E8C396', '#FFD166', '#EF476F', '#118AB2', '#B565A7'];
        const clothesColors = ['#FF99C8', '#FCF6BD', '#D0F4DE', '#A9DEF9', '#E4C1F9', '#FFD6A5', '#FDFFB6', '#9BF6FF'];

        // --- SVG Компоненты ---
        const renderClothes = (type, color, skinColor) => {
            switch (type) {
                case 0:
                    return (
                        <g>
                            <path d="M 20 100 Q 50 70 80 100" fill={color} />
                            <rect x="42" y="65" width="16" height="15" fill={skinColor} />
                            <path d="M 42 75 Q 50 85 58 75" fill="none" stroke="#333" strokeWidth="2" opacity="0.3" />
                        </g>
                    );
                case 1:
                    return (
                        <g>
                            <path d="M 15 100 Q 50 65 85 100" fill={color} />
                            <rect x="40" y="65" width="20" height="18" fill={color} rx="4" />
                            <line x1="45" y1="65" x2="45" y2="80" stroke="#333" strokeWidth="1" opacity="0.1" />
                            <line x1="55" y1="65" x2="55" y2="80" stroke="#333" strokeWidth="1" opacity="0.1" />
                        </g>
                    );
                case 2:
                    return (
                        <g>
                            <path d="M 18 100 Q 50 75 82 100" fill={color} />
                            <rect x="42" y="65" width="16" height="15" fill={skinColor} />
                            <path d="M 42 75 L 50 88 L 58 75" fill={skinColor} />
                        </g>
                    );
                case 3:
                    return (
                        <g>
                            <path d="M 20 100 Q 50 70 80 100" fill={color} />
                            <rect x="42" y="65" width="16" height="15" fill={skinColor} />
                            <polygon points="42,75 35,85 50,82" fill="#FFF" />
                            <polygon points="58,75 65,85 50,82" fill="#FFF" />
                            <line x1="50" y1="82" x2="50" y2="100" stroke="#333" strokeWidth="2" opacity="0.1" />
                        </g>
                    );
                default: return null;
            }
        };

        const renderHairBack = (type, color) => {
            switch (type) {
                case 1: return <path d="M 25 50 L 25 85 Q 50 95 75 85 L 75 50 Z" fill={color} />;
                case 3:
                    return (
                        <g fill={color}>
                            <circle cx="25" cy="60" r="15" />
                            <circle cx="28" cy="75" r="12" />
                            <circle cx="75" cy="60" r="15" />
                            <circle cx="72" cy="75" r="12" />
                            <path d="M 20 50 L 20 80 Q 50 90 80 80 L 80 50 Z" />
                        </g>
                    );
                default: return null;
            }
        };

        const renderHairFront = (type, color) => {
            switch (type) {
                case 0:
                    return (
                        <g fill={color}>
                            <path d="M 25 45 Q 50 15 75 45 Q 85 30 50 10 Q 15 30 25 45 Z" />
                            <polygon points="30,35 40,45 45,30" />
                            <polygon points="50,30 60,42 65,28" />
                            <polygon points="65,35 75,45 80,30" />
                        </g>
                    );
                case 1:
                    return (
                        <g fill={color}>
                            <path d="M 25 45 Q 50 15 75 45 L 75 35 Q 50 20 25 35 Z" />
                            <path d="M 23 45 L 77 45 Q 77 30 50 20 Q 23 30 23 45 Z" />
                        </g>
                    );
                case 2:
                    return (
                        <g fill={color}>
                            <path d="M 25 45 Q 50 15 75 45 Q 80 25 50 15 Q 20 25 25 45 Z" />
                            <path d="M 25 40 Q 40 25 70 45 Q 60 25 35 25 Z" />
                        </g>
                    );
                case 3:
                    return (
                        <g fill={color}>
                            <circle cx="35" cy="30" r="12" />
                            <circle cx="50" cy="25" r="14" />
                            <circle cx="65" cy="30" r="12" />
                            <circle cx="28" cy="40" r="10" />
                            <circle cx="72" cy="40" r="10" />
                        </g>
                    );
                case 4:
                    return <path d="M 30 35 Q 50 22 70 35 Q 50 20 30 35 Z" fill={color} opacity="0.6" />;
                default: return null;
            }
        };

        const renderEyes = (type) => {
            const eyeColor = "#2B2B2B";
            switch (type) {
                case 0:
                    return (
                        <g fill={eyeColor}>
                            <circle cx="38" cy="50" r="3.5" />
                            <circle cx="62" cy="50" r="3.5" />
                        </g>
                    );
                case 1:
                    return (
                        <g fill={eyeColor} stroke={eyeColor} strokeWidth="2" strokeLinecap="round">
                            <circle cx="38" cy="50" r="3.5" stroke="none" />
                            <circle cx="62" cy="50" r="3.5" stroke="none" />
                            <line x1="36" y1="47" x2="33" y2="44" />
                            <line x1="64" y1="47" x2="67" y2="44" />
                        </g>
                    );
                case 2:
                    return (
                        <g stroke={eyeColor} strokeWidth="3" strokeLinecap="round" fill="none">
                            <path d="M 33 50 Q 38 45 43 50" />
                            <path d="M 57 50 Q 62 45 67 50" />
                        </g>
                    );
                case 3:
                    return (
                        <g stroke={eyeColor} strokeWidth="2.5" fill="none">
                            <circle cx="38" cy="50" r="6" fill="#FFF" opacity="0.5" />
                            <circle cx="62" cy="50" r="6" fill="#FFF" opacity="0.5" />
                            <line x1="44" y1="50" x2="56" y2="50" />
                            <circle cx="38" cy="50" r="2" fill={eyeColor} stroke="none" />
                            <circle cx="62" cy="50" r="2" fill={eyeColor} stroke="none" />
                        </g>
                    );
                default: return null;
            }
        };

        const renderMouth = (type) => {
            switch (type) {
                case 0: return <path d="M 45 60 Q 50 64 55 60" stroke="#2B2B2B" strokeWidth="2.5" fill="none" strokeLinecap="round" />;
                case 1: return <path d="M 47 60 Q 52 62 56 58" stroke="#2B2B2B" strokeWidth="2.5" fill="none" strokeLinecap="round" />;
                case 2: return <path d="M 44 59 Q 50 68 56 59 Z" fill="#EF476F" />;
                case 3: return <line x1="46" y1="60" x2="54" y2="60" stroke="#2B2B2B" strokeWidth="2.5" strokeLinecap="round" />;
                default: return null;
            }
        };

        const renderAccessory = (type) => {
            switch (type) {
                case 3:
                    return (
                        <g transform="translate(30, 56) rotate(-15)">
                            <rect x="-6" y="-3" width="12" height="6" rx="2" fill="#FFE0CC" opacity="0.8" />
                            <rect x="-2" y="-3" width="4" height="6" fill="#FFD1B3" />
                        </g>
                    );
                default: return null;
            }
        };

        // Icon Components
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;

        function App() {
            // Поддержка передачи seed через query параметр (для iframe)
            const urlParams = new URLSearchParams(window.location.search);
            const initialSeed = urlParams.get('seed') || 'Ivan';

            const [seed, setSeed] = useState(initialSeed);
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                // Если мы во фрейме, отправляем обновление наверх
                const svgEl = document.getElementById('human-avatar-svg');
                if (svgEl) {
                    const svgData = new XMLSerializer().serializeToString(svgEl);
                    window.parent.postMessage({ type: 'AVATAR_UPDATE', svg: svgData, seed: seed }, '*');
                }
            }, [seed]);

            const randomize = () => {
                const randomWords = ['Ivan', 'Anna', 'Alex', 'Maria', 'Max', 'Julia', 'Oleg', 'Sophia', 'Leo', 'Eva'];
                const randomSeed = randomWords[Math.floor(Math.random() * randomWords.length)] + Math.floor(Math.random() * 100);
                setSeed(randomSeed);
            };

            const hash = hashCode(seed || 'human');
            const bgColor = bgColors[hash % bgColors.length];
            const skinColor = skinColors[(hash >> 1) % skinColors.length];
            const hairColor = hairColors[(hash >> 2) % hairColors.length];
            const clothesColor = clothesColors[(hash >> 3) % clothesColors.length];
            
            const hairType = (hash >> 4) % 5;
            const clothesType = (hash >> 5) % 4;
            const eyeType = (hash >> 6) % 4;
            const mouthType = (hash >> 7) % 4;
            const accessoryType = (hash >> 8) % 4;

            const handleCopySvg = () => {
                const svgEl = document.getElementById('human-avatar-svg');
                const svgData = new XMLSerializer().serializeToString(svgEl);
                navigator.clipboard.writeText(svgData);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const handleDownload = () => {
                const svgEl = document.getElementById('human-avatar-svg');
                const svgData = new XMLSerializer().serializeToString(svgEl);
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `avatar-${seed}.svg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen bg-transparent flex items-center justify-center p-4 font-sans text-slate-800">
                    <div className="bg-white rounded-3xl shadow-xl overflow-hidden max-w-md w-full border border-slate-100">
                        
                        <div className="bg-gradient-to-r from-blue-100 to-indigo-100 p-6 text-center">
                            <h1 className="text-2xl font-bold text-slate-800 mb-2">Генератор Портретов 🧑‍🎨</h1>
                            <p className="text-sm text-slate-600">Впишите имя, чтобы создать уникальный аватар</p>
                        </div>

                        <div className="p-8">
                            <div className="flex justify-center mb-8 relative">
                                <div className="w-48 h-48 rounded-full shadow-md transition-transform duration-300 hover:scale-105 overflow-hidden border-4 border-white ring-2 ring-slate-100 bg-white">
                                    <svg id="human-avatar-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-full h-full">
                                        <rect width="100" height="100" fill={bgColor} />
                                        {renderHairBack(hairType, hairColor)}
                                        {renderClothes(clothesType, clothesColor, skinColor)}
                                        <path d="M 28 40 Q 28 75 50 75 Q 72 75 72 40 Q 72 20 50 20 Q 28 20 28 40 Z" fill={skinColor} />
                                        <ellipse cx="26" cy="45" rx="4" ry="6" fill={skinColor} />
                                        <ellipse cx="74" cy="45" rx="4" ry="6" fill={skinColor} />
                                        <ellipse cx="34" cy="53" rx="4" ry="2" fill="#FF99C8" opacity="0.4" />
                                        <ellipse cx="66" cy="53" rx="4" ry="2" fill="#FF99C8" opacity="0.4" />
                                        {renderEyes(eyeType)}
                                        {renderMouth(mouthType)}
                                        {renderAccessory(accessoryType)}
                                        {renderHairFront(hairType, hairColor)}
                                    </svg>
                                </div>
                                
                                <button 
                                    onClick={randomize}
                                    className="absolute right-8 bottom-0 bg-white p-3 rounded-full shadow-lg border border-slate-100 hover:bg-slate-50 text-indigo-500 transition-colors"
                                    title="Случайный аватар"
                                >
                                    <IconRefresh />
                                </button>
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-medium text-slate-700 mb-2">
                                    Имя пользователя (Seed)
                                </label>
                                <input
                                    type="text"
                                    value={seed}
                                    onChange={(e) => setSeed(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition-all text-lg font-medium text-center"
                                    placeholder="Например, Ivan"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <button 
                                    onClick={handleDownload}
                                    className="flex items-center justify-center gap-2 w-full py-3 bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition-colors font-medium text-sm"
                                >
                                    <IconDownload />
                                    Скачать SVG
                                </button>
                                <button 
                                    onClick={handleCopySvg}
                                    className="flex items-center justify-center gap-2 w-full py-3 bg-indigo-50 text-indigo-700 rounded-xl hover:bg-indigo-100 transition-colors font-medium text-sm border border-indigo-100"
                                >
                                    {copied ? <IconCheck /> : <IconCopy />}
                                    {copied ? 'Скопировано!' : 'Код SVG'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
